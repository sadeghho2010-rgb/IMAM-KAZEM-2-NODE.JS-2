<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Full Bleed for Maskable) -->
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="glowGradMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background with NO rounded corners (Android applies mask) -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />
  <circle cx="256" cy="256" r="230" fill="url(#glowGradMask)" />

  <!-- Inner Safe-Zone Content (Scale 0.72 centered at 256, 256) -->
  <g transform="translate(256, 256) scale(0.72) translate(-256, -256)">
    <!-- Decorative Inner Gold Ring -->
    <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGradMask)" stroke-width="3" stroke-opacity="0.4" />
    <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGradMask)" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="6,6" />

    <!-- Open Book / Manuscript -->
    <!-- Left Page -->
    <path d="M 256 360 C 220 335, 170 338, 130 355 C 130 355, 140 280, 256 265 Z" fill="#ffffff" />
    <path d="M 256 360 C 220 335, 170 338, 130 355 C 130 355, 140 280, 256 265 Z" 
          fill="url(#goldGradMask)" fill-opacity="0.15" stroke="url(#goldGradMask)" stroke-width="4" />
    
    <!-- Right Page -->
    <path d="M 256 360 C 292 335, 342 338, 382 355 C 382 355, 372 280, 256 265 Z" fill="#ffffff" />
    <path d="M 256 360 C 292 335, 342 338, 382 355 C 382 355, 372 280, 256 265 Z" 
          fill="url(#goldGradMask)" fill-opacity="0.15" stroke="url(#goldGradMask)" stroke-width="4" />

    <path d="M 256 265 L 256 375" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
    <!-- Book Wooden Stand / Rehl -->
    <path d="M 190 365 L 256 385 L 322 365 L 340 395 L 256 405 L 172 395 Z" fill="url(#goldGradMask)" stroke="#b45309" stroke-width="2" />

    <!-- Calligraphic Letter "ط" -->
    <path d="M 248 105 C 248 95, 264 95, 264 105 L 264 245 C 264 252, 256 256, 248 252 C 244 250, 248 200, 248 105 Z" fill="url(#goldGradMask)" />
    <!-- Crown / Light Point -->
    <circle cx="256" cy="85" r="8" fill="#fef08a" />
    <circle cx="256" cy="85" r="14" fill="#fbbf24" opacity="0.3" />

    <!-- Loop of Taa -->
    <path d="M 210 242 C 180 242, 170 205, 215 195 C 255 186, 310 192, 325 220 C 335 240, 315 252, 280 252 C 240 252, 175 252, 160 252 C 150 252, 145 242, 155 240 C 180 236, 290 236, 305 236 C 315 236, 318 226, 310 216 C 298 202, 255 198, 222 206 C 192 213, 192 232, 215 234 C 235 236, 260 236, 280 236" fill="url(#goldGradMask)" />

    <!-- Bottom Badge -->
    <g transform="translate(256, 442)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="url(#goldGradMask)" stroke-width="1.5" />
      <text x="0" y="5" font-family="'Vazirmatn', 'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="13" fill="#fef08a" text-anchor="middle">
        سامانه جامع طلاب
      </text>
    </g>
  </g>
</svg>
