<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Full Bleed for Android adaptive mask) -->
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="35%" stop-color="#0a142c" />
      <stop offset="70%" stop-color="#0f2042" />
      <stop offset="100%" stop-color="#142c54" />
    </linearGradient>

    <!-- Imperial Gold Gradient -->
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <radialGradient id="centerAuraMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#eab308" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0a142c" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="emeraldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="pageGradLeftMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="pageGradRightMask" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="shadowDepthMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="goldGlowMask" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fde047" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Full-bleed background rectangle without rx -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />
  <circle cx="256" cy="256" r="230" fill="url(#centerAuraMask)" />

  <!-- Sacred Geometry Backing -->
  <g opacity="0.15" stroke="url(#goldGradMask)" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="160" />
    <circle cx="256" cy="256" r="115" stroke-dasharray="6,4" />
    <rect x="166" y="166" width="180" height="180" rx="6" />
    <rect x="166" y="166" width="180" height="180" rx="6" transform="rotate(45 256 256)" />
  </g>

  <!-- Scaled down 82% to fit perfectly within 75% Android Safe Zone Circle -->
  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)">
    <!-- Mihrab Arch of Wisdom -->
    <g filter="url(#shadowDepthMask)">
      <path d="M 132 396 L 132 230 C 132 140, 256 86, 256 86 C 256 86, 380 140, 380 230 L 380 396 Z"
            fill="#071026" fill-opacity="0.85" stroke="url(#goldGradMask)" stroke-width="4.5" stroke-linejoin="round" />
      <path d="M 152 396 L 152 242 C 152 165, 256 115, 256 115 C 256 115, 360 165, 360 242 L 360 396 Z"
            fill="none" stroke="url(#emeraldGradMask)" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="8,5" />
    </g>

    <!-- Radiant Shamseh Star -->
    <g transform="translate(256, 126)" filter="url(#goldGlowMask)">
      <polygon points="0,-26 7,-9 25,-9 11,2 17,20 0,9 -17,20 -11,2 -25,-9 -7,-9" fill="url(#goldGradMask)" />
      <polygon points="0,-26 7,-9 25,-9 11,2 17,20 0,9 -17,20 -11,2 -25,-9 -7,-9" transform="rotate(22.5)" fill="url(#goldGradMask)" opacity="0.75" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>

    <!-- Open Book of Wisdom -->
    <g filter="url(#shadowDepthMask)">
      <path d="M 256 348 C 210 322, 142 324, 98 340 C 98 340, 110 260, 256 238 C 402 260, 414 340, 414 340 C 370 324, 302 322, 256 348 Z"
            fill="#0c1735" stroke="url(#goldGradMask)" stroke-width="3" />

      <path d="M 256 342 C 215 316, 150 318, 108 334 C 114 266, 175 244, 256 244 Z"
            fill="url(#pageGradLeftMask)" stroke="url(#goldGradMask)" stroke-width="2.5" />
      <path d="M 256 342 C 297 316, 362 318, 404 334 C 398 266, 337 244, 256 244 Z"
            fill="url(#pageGradRightMask)" stroke="url(#goldGradMask)" stroke-width="2.5" />

      <path d="M 256 336 C 216 312, 158 314, 118 328 C 124 272, 178 252, 256 252 Z" fill="#ffffff" />
      <path d="M 256 336 C 296 312, 354 314, 394 328 C 388 272, 334 252, 256 252 Z" fill="#ffffff" />

      <path d="M 256 244 L 256 364" stroke="url(#goldGradMask)" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 256 348 C 256 372, 244 382, 240 398 L 248 398 L 256 388 L 264 398 L 272 398 C 268 382, 256 372, 256 348 Z" fill="url(#goldGradMask)" />

      <!-- Text Lines -->
      <g stroke="url(#goldGradMask)" stroke-width="2" stroke-linecap="round" opacity="0.75">
        <line x1="145" y1="288" x2="232" y2="282" />
        <line x1="140" y1="302" x2="234" y2="296" />
        <line x1="150" y1="316" x2="228" y2="310" />
        <line x1="280" y1="282" x2="367" y2="288" />
        <line x1="278" y1="296" x2="372" y2="302" />
        <line x1="284" y1="310" x2="362" y2="316" />
      </g>
    </g>

    <!-- Luminous Pen of Light -->
    <g filter="url(#goldGlowMask)">
      <path d="M 256 160 C 244 195, 247 218, 256 242 C 265 218, 268 195, 256 160 Z" fill="url(#goldGradMask)" />
      <path d="M 256 178 C 248 200, 250 216, 256 230 C 262 216, 264 200, 256 178 Z" fill="#ffffff" />
    </g>

    <!-- Rehl Wooden Stand -->
    <g filter="url(#shadowDepthMask)">
      <path d="M 172 360 L 256 394 L 340 360 L 358 392 L 256 428 L 154 392 Z"
            fill="url(#goldGradMask)" stroke="#78350f" stroke-width="2" stroke-linejoin="round" />
      <path d="M 154 392 L 138 416 L 168 418 L 178 398 Z" fill="url(#goldGradMask)" stroke="#78350f" stroke-width="1.5" />
      <path d="M 358 392 L 374 416 L 344 418 L 334 398 Z" fill="url(#goldGradMask)" stroke="#78350f" stroke-width="1.5" />
      <circle cx="256" cy="411" r="5" fill="#fef08a" stroke="#854d0e" stroke-width="1.5" />
    </g>
  </g>
</svg>
