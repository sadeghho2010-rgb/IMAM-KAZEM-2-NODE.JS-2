<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background: Ultra-luxurious Deep Twilight Sapphire into Royal Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c122c" />
      <stop offset="30%" stop-color="#14183d" />
      <stop offset="70%" stop-color="#1c1f4e" />
      <stop offset="100%" stop-color="#090d20" />
    </linearGradient>

    <!-- Glossy App Tile Specular Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 24K Polished Metallic Gold (High Contrast & Specular Luster) -->
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Gold Accent 2: Reverse flow for 3D bevels -->
    <linearGradient id="goldReverse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Radiant Turquoise / Emerald Spiritual Glow -->
    <linearGradient id="emeraldTurquoise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#2dd4bf" />
      <stop offset="80%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Central Luminous Ambient Flare -->
    <radialGradient id="sunburstGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.32" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0c122c" stop-opacity="0" />
    </radialGradient>

    <!-- Shimmer Core Radial -->
    <radialGradient id="starCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Drop Shadows for 3D Physicality -->
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#020617" flood-opacity="0.5" />
    </filter>

    <filter id="emblemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#eab308" flood-opacity="0.45" />
    </filter>

    <filter id="pureGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Master Squircle App Tile with Beveled Outer Border -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow in Upper Center -->
  <circle cx="256" cy="235" r="215" fill="url(#sunburstGlow)" />

  <!-- 2. Dual Precision Inset Glass Borders (iOS Style) -->
  <rect x="18" y="18" width="476" height="476" rx="100" fill="none" stroke="url(#gold24k)" stroke-width="2.5" stroke-opacity="0.45" />
  <rect x="28" y="28" width="456" height="456" rx="90" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="8,6" />

  <!-- Top Glass Sheen Overlay -->
  <path d="M 0 118 C 0 52.8 52.8 0 118 0 L 394 0 C 459.2 0 512 52.8 512 118 L 512 240 C 350 200, 162 270, 0 220 Z" 
        fill="url(#glossGrad)" />

  <!-- 3. Minimalist Sacred Geometry Backing (Delicate 8-Point Rosette) -->
  <g opacity="0.18" stroke="url(#gold24k)" stroke-width="1.5" fill="none">
    <circle cx="256" cy="245" r="150" />
    <circle cx="256" cy="245" r="105" stroke-dasharray="5,4" />
    <polygon points="256,120 286,215 381,245 286,275 256,370 226,275 131,245 226,215" stroke-width="1" />
    <polygon points="256,120 286,215 381,245 286,275 256,370 226,275 131,245 226,215" transform="rotate(45 256 245)" stroke-width="1" stroke-opacity="0.6" />
  </g>

  <!-- 4. Grand Golden Dome / Mihrab of Wisdom (Crowning Canopy) -->
  <g filter="url(#emblemGlow)">
    <!-- Outer Elegant Silhouette Arch -->
    <path d="M 145 375 C 145 240, 205 155, 256 120 C 307 155, 367 240, 367 375 C 345 385, 325 390, 256 390 C 187 390, 167 385, 145 375 Z"
          fill="#0c1228" fill-opacity="0.75" stroke="url(#gold24k)" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Inner Turquoise Accent Ribbon -->
    <path d="M 165 365 C 165 255, 215 180, 256 150 C 297 180, 347 255, 347 365"
          fill="none" stroke="url(#emeraldTurquoise)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- 5. Dynamic Soaring Pages of the Book of Knowledge (کتاب گشوده زرین و بال‌های معرفت) -->
  <g filter="url(#emblemGlow)">
    <!-- Left Wing/Page (Sculpted Floating 3D Page) -->
    <path d="M 256 325 C 220 300, 148 298, 92 316 C 96 235, 172 208, 256 220 Z"
          fill="url(#gold24k)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Left Page Inner Dimensional Fold -->
    <path d="M 256 325 C 220 306, 156 308, 108 322 C 114 255, 180 230, 256 238 Z"
          fill="url(#goldReverse)" opacity="0.8" />

    <!-- Left Page Highlight Ridge -->
    <path d="M 108 322 C 160 270, 210 248, 256 244"
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />

    <!-- Right Wing/Page (Sculpted Floating 3D Page) -->
    <path d="M 256 325 C 292 300, 364 298, 420 316 C 416 235, 340 208, 256 220 Z"
          fill="url(#gold24k)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Right Page Inner Dimensional Fold -->
    <path d="M 256 325 C 292 306, 356 308, 404 322 C 398 255, 332 230, 256 238 Z"
          fill="url(#goldReverse)" opacity="0.8" />

    <!-- Right Page Highlight Ridge -->
    <path d="M 404 322 C 352 270, 302 248, 256 244"
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />

    <!-- Central Binding Spine & Golden Ribbon Marker -->
    <line x1="256" y1="220" x2="256" y2="350" stroke="url(#gold24k)" stroke-width="5" stroke-linecap="round" />
    <polygon points="256,340 246,368 256,360 266,368" fill="url(#gold24k)" />

    <!-- Fine Inlaid Calligraphic Wisdom Lines (Micro Details) -->
    <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.7">
      <line x1="140" y1="274" x2="225" y2="264" />
      <line x1="135" y1="290" x2="228" y2="280" />
      <line x1="146" y1="305" x2="222" y2="296" />
      <line x1="287" y1="264" x2="372" y2="274" />
      <line x1="284" y1="280" x2="377" y2="290" />
      <line x1="290" y1="296" x2="366" y2="305" />
    </g>
  </g>

  <!-- 6. Celestial Torch / Pen of Guidance & Diamond Star (قلم هدایت و ستاره شمسه) -->
  <g filter="url(#pureGlow)">
    <!-- Vertical Radiant Beam -->
    <line x1="256" y1="125" x2="256" y2="215" stroke="url(#gold24k)" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Floating Light Crystal / Diamond Star Core -->
    <g transform="translate(256, 172)">
      <!-- 8-Pointed Faceted Star -->
      <polygon points="0,-24 6,-7 23,-7 10,3 15,19 0,9 -15,19 -10,3 -23,-7 -6,-7" fill="url(#starCore)" />
      <polygon points="0,-24 6,-7 23,-7 10,3 15,19 0,9 -15,19 -10,3 -23,-7 -6,-7" transform="rotate(22.5)" fill="#ffffff" opacity="0.65" />
      <!-- Central Brilliant Sparkle -->
      <circle cx="0" cy="0" r="5.5" fill="#ffffff" />
    </g>

    <!-- Star at Apex of Mihrab -->
    <g transform="translate(256, 112)">
      <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#ffffff" />
      <circle cx="0" cy="0" r="3" fill="#fde047" />
    </g>
  </g>

  <!-- 7. Sculpted Pedestal / Modern Minimalist Rehl Base -->
  <g filter="url(#emblemGlow)">
    <!-- Sweeping Winged Stand -->
    <path d="M 160 380 C 205 365, 235 372, 256 388 C 277 372, 307 365, 352 380 C 362 400, 345 412, 256 415 C 167 412, 150 400, 160 380 Z"
          fill="url(#gold24k)" stroke="#5c2602" stroke-width="1.8" stroke-linejoin="round" />
    <!-- Center Jewel on Pedestal -->
    <circle cx="256" cy="398" r="4.5" fill="#2dd4bf" stroke="#ffffff" stroke-width="1.2" />
  </g>

  <!-- Subtle Sparkling Light Dust (Ambient Elegance) -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="178" cy="190" r="2.2" filter="url(#pureGlow)" />
    <circle cx="334" cy="190" r="2.2" filter="url(#pureGlow)" />
    <circle cx="210" cy="148" r="1.6" />
    <circle cx="302" cy="148" r="1.6" />
    <circle cx="120" cy="245" r="1.8" />
    <circle cx="392" cy="245" r="1.8" />
  </g>
</svg>
