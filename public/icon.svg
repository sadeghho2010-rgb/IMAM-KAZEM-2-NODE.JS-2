<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Light Glow Gradient -->
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="220" r="180" fill="url(#glowGrad)" />

  <!-- Outer Decorative Golden Ring -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" />
  <rect x="40" y="40" width="432" height="432" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Corner Ornamental Dots -->
  <circle cx="56" cy="56" r="4" fill="#fbbf24" opacity="0.8" />
  <circle cx="456" cy="56" r="4" fill="#fbbf24" opacity="0.8" />
  <circle cx="56" cy="456" r="4" fill="#fbbf24" opacity="0.8" />
  <circle cx="456" cy="456" r="4" fill="#fbbf24" opacity="0.8" />

  <!-- Central Star of Knowledge / Eight-pointed Motif Backdrop -->
  <g transform="translate(256, 230) scale(0.95)" opacity="0.25">
    <rect x="-85" y="-85" width="170" height="170" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <rect x="-85" y="-85" width="170" height="170" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="3" transform="rotate(45)" />
  </g>

  <!-- Main Symbol Group (Crest with Open Book and Letter Taa) -->
  <g filter="url(#dropShadow)">
    <!-- Mihrab / Dome Arch Background -->
    <path d="M 180 340 L 180 230 C 180 180, 256 130, 256 130 C 256 130, 332 180, 332 230 L 332 340 Z" 
          fill="#1e1b4b" fill-opacity="0.6" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />

    <!-- Open Book / Holy Quran / Scientific Manuscript Emblem -->
    <!-- Left Page -->
    <path d="M 256 360 C 220 335, 170 338, 130 355 C 130 355, 140 280, 256 265 Z" 
          fill="#ffffff" />
    <path d="M 256 360 C 220 335, 170 338, 130 355 C 130 355, 140 280, 256 265 Z" 
          fill="url(#goldGrad)" fill-opacity="0.12" stroke="url(#goldGrad)" stroke-width="3.5" />
    
    <!-- Right Page -->
    <path d="M 256 360 C 292 335, 342 338, 382 355 C 382 355, 372 280, 256 265 Z" 
          fill="#ffffff" />
    <path d="M 256 360 C 292 335, 342 338, 382 355 C 382 355, 372 280, 256 265 Z" 
          fill="url(#goldGrad)" fill-opacity="0.12" stroke="url(#goldGrad)" stroke-width="3.5" />

    <!-- Book Spine & Binding Details -->
    <path d="M 256 265 L 256 375" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
    <!-- Page Lines for Left Page -->
    <path d="M 165 315 C 195 305, 225 305, 245 310" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 160 330 C 190 320, 225 320, 245 325" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <!-- Page Lines for Right Page -->
    <path d="M 347 315 C 317 305, 287 305, 267 310" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 352 330 C 322 320, 287 320, 267 325" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Book Wooden Stand / Rehl Base -->
    <path d="M 190 365 L 256 385 L 322 365 L 340 395 L 256 405 L 172 395 Z" 
          fill="url(#goldGrad)" stroke="#b45309" stroke-width="2" />

    <!-- Calligraphic Letter "ط" (Symbol of Tolab & Talieh) -->
    <!-- Vertical Ascender of Taa -->
    <path d="M 248 105 C 248 95, 264 95, 264 105 L 264 245 C 264 252, 256 256, 248 252 C 244 250, 248 200, 248 105 Z" 
          fill="url(#goldGrad)" filter="url(#glowShadow)" />
    <!-- Crown / Light of Knowledge Quill Tip at the Top -->
    <path d="M 256 80 L 263 96 L 256 104 L 249 96 Z" fill="#fef08a" />
    <circle cx="256" cy="92" r="6" fill="#fbbf24" opacity="0.9" />

    <!-- Oval Loop Body of Taa -->
    <path d="M 210 242 C 180 242, 170 205, 215 195 C 255 186, 310 192, 325 220 C 335 240, 315 252, 280 252 C 240 252, 175 252, 160 252 C 150 252, 145 242, 155 240 C 180 236, 290 236, 305 236 C 315 236, 318 226, 310 216 C 298 202, 255 198, 222 206 C 192 213, 192 232, 215 234 C 235 236, 260 236, 280 236" 
          fill="url(#goldGrad)" />
  </g>

  <!-- Elegant Bottom Banner / Subtitle -->
  <g transform="translate(256, 442)">
    <!-- Soft Glow Pill -->
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0f172a" fill-opacity="0.6" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />
    <text x="0" y="5" font-family="'Vazirmatn', 'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="13" fill="#fef08a" text-anchor="middle" letter-spacing="1">
      سامانه جامع طلاب
    </text>
  </g>
</svg>
