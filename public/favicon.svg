<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="50%" stop-color="#0f2042" />
      <stop offset="100%" stop-color="#142c54" />
    </linearGradient>

    <!-- Punchy High-Contrast Gold -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Rounded Tile with Soft Corner Radius -->
  <rect width="128" height="128" rx="30" fill="url(#favBg)" />
  <rect x="5" y="5" width="118" height="118" rx="25" fill="none" stroke="url(#favGold)" stroke-width="2.5" stroke-opacity="0.5" />

  <!-- Mihrab Arch Silhouette -->
  <path d="M 28 100 L 28 58 C 28 32, 64 18, 64 18 C 64 18, 100 32, 100 58 L 100 100 Z"
        fill="#071026" stroke="url(#favGold)" stroke-width="3" stroke-linejoin="round" />

  <!-- Luminous Star at Apex -->
  <polygon points="64,21 67,27 74,27 68,32 70,39 64,34 58,39 60,32 54,27 61,27" fill="#ffffff" />
  <circle cx="64" cy="30" r="2.5" fill="#fef08a" />

  <!-- Golden Open Manuscript Book -->
  <!-- Left Page -->
  <path d="M 64 85 C 52 76, 32 78, 20 84 C 22 62, 40 54, 64 54 Z"
        fill="#f8fafc" stroke="url(#favGold)" stroke-width="2" stroke-linejoin="round" />
  <!-- Right Page -->
  <path d="M 64 85 C 76 76, 96 78, 108 84 C 106 62, 88 54, 64 54 Z"
        fill="#f8fafc" stroke="url(#favGold)" stroke-width="2" stroke-linejoin="round" />

  <!-- Book Spine & Ribbon -->
  <line x1="64" y1="54" x2="64" y2="92" stroke="url(#favGold)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 64 88 L 60 99 L 64 96 L 68 99 Z" fill="url(#favGold)" />

  <!-- Symbolic Pen of Light / Flame -->
  <path d="M 64 36 C 60 44, 61 50, 64 54 C 67 50, 68 44, 64 36 Z" fill="url(#favGold)" />
  <circle cx="64" cy="45" r="2" fill="#ffffff" />

  <!-- Golden Rehl Base Feet -->
  <path d="M 38 90 L 64 100 L 90 90 L 98 102 L 64 112 L 30 102 Z"
        fill="url(#favGold)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" />
  <circle cx="64" cy="106" r="2" fill="#ffffff" />
</svg>
