<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c122c" />
      <stop offset="45%" stop-color="#1c1f4e" />
      <stop offset="100%" stop-color="#090d20" />
    </linearGradient>

    <!-- Punchy High-Contrast 24K Gold -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <radialGradient id="favAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0c122c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="128" height="128" rx="30" fill="url(#favBg)" />
  <circle cx="64" cy="62" r="54" fill="url(#favAura)" />
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="url(#favGold)" stroke-width="2.2" stroke-opacity="0.5" />

  <!-- Grand Mihrab Arch -->
  <path d="M 32 96 C 32 60, 48 38, 64 28 C 80 38, 96 60, 96 96 C 88 99, 78 100, 64 100 C 50 100, 40 99, 32 96 Z"
        fill="#0a0f24" stroke="url(#favGold)" stroke-width="3" stroke-linejoin="round" />

  <!-- Inner Turquoise Arch Line -->
  <path d="M 38 92 C 38 64, 50 45, 64 36 C 78 45, 90 64, 90 92"
        fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

  <!-- Soaring Golden Open Book -->
  <!-- Left Page -->
  <path d="M 64 82 C 54 75, 34 76, 20 81 C 22 58, 42 51, 64 54 Z"
        fill="url(#favGold)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Right Page -->
  <path d="M 64 82 C 74 75, 94 76, 108 81 C 106 58, 86 51, 64 54 Z"
        fill="url(#favGold)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Book Spine Center -->
  <line x1="64" y1="52" x2="64" y2="88" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <polygon points="64,84 60,93 64,90 68,93" fill="url(#favGold)" />

  <!-- Central Radiant Star of Wisdom -->
  <g transform="translate(64, 43)">
    <polygon points="0,-12 3,-3 12,-3 5,2 7,10 0,5 -7,10 -5,2 -12,-3 -3,-3" fill="#ffffff" />
    <circle cx="0" cy="0" r="3" fill="#fde047" />
  </g>

  <!-- Rehl Stand Pedestal Footing -->
  <path d="M 38 98 C 50 94, 58 96, 64 100 C 70 96, 78 94, 90 98 C 93 103, 86 106, 64 107 C 42 106, 35 103, 38 98 Z"
        fill="url(#favGold)" stroke="#78350f" stroke-width="1" />
  <circle cx="64" cy="103" r="1.8" fill="#2dd4bf" />
</svg>
